<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>memory-map plugin icon</title>
  <!-- Derived from memory_map_social_card.svg: same palette, grid, card primitive and hard shadow.
       Three skill cards stacked as memory layers: prune (green), recall (orange), map (blue, front). -->
  <defs>
    <pattern id="grid" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#0D0D0D" stroke-width="1.5" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="#FDFCF8"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Back card: memory-prune -->
  <g transform="translate(320, 170)">
    <rect x="20" y="20" width="560" height="420" fill="#0D0D0D"/>
    <rect x="0" y="0" width="560" height="420" fill="#FDFCF8" stroke="#0D0D0D" stroke-width="12"/>
    <rect x="6" y="6" width="548" height="84" fill="#007A33"/>
    <line x1="6" y1="90" x2="554" y2="90" stroke="#0D0D0D" stroke-width="12"/>
  </g>

  <!-- Middle card: memory-recall -->
  <g transform="translate(222, 292)">
    <rect x="20" y="20" width="560" height="420" fill="#0D0D0D"/>
    <rect x="0" y="0" width="560" height="420" fill="#FDFCF8" stroke="#0D0D0D" stroke-width="12"/>
    <rect x="6" y="6" width="548" height="84" fill="#FF4D00"/>
    <line x1="6" y1="90" x2="554" y2="90" stroke="#0D0D0D" stroke-width="12"/>
  </g>

  <!-- Front card: memory-map -->
  <g transform="translate(124, 414)">
    <rect x="20" y="20" width="560" height="420" fill="#0D0D0D"/>
    <rect x="0" y="0" width="560" height="420" fill="#FDFCF8" stroke="#0D0D0D" stroke-width="12"/>
    <rect x="6" y="6" width="548" height="84" fill="#0057FF"/>
    <line x1="6" y1="90" x2="554" y2="90" stroke="#0D0D0D" stroke-width="12"/>
    <!-- Accent rule, as under each card title on the social card -->
    <rect x="56" y="146" width="96" height="14" fill="#0057FF"/>
    <!-- Memory entries -->
    <rect x="56" y="204" width="400" height="28" fill="#0D0D0D"/>
    <rect x="56" y="268" width="320" height="28" fill="#0D0D0D"/>
    <rect x="56" y="332" width="360" height="28" fill="#0D0D0D"/>
  </g>
</svg>
